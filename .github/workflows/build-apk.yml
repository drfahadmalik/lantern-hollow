name: Build Lantern Hollow APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: npm ci

      - name: Copy the game into the Android project
        run: npx cap sync android

      - name: Build the APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: LanternHollow-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish the APK to the download page
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk LanternHollow.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest LanternHollow.apk --title "Lantern Hollow (latest)" --notes "Download LanternHollow.apk below and install it on your phone."
        env:
          GH_TOKEN: ${{ github.token }}
